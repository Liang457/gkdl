[package]
name = "gkdl"
version = "0.2.5"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
# libcurl 静态链接（内置 curl 8.21.0 源码，Windows 自动启用 Schannel TLS）
curl = { version = "0.4.50", features = ["static-curl", "http2"] }
# URL 同款 IDN 实现，用于中文域名转 punycode（curl 线程化 resolver 无 IDN）
idna = "1"
axum = { version = "0.8", features = ["ws", "json"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
futures-util = "0.3"
sha2 = "0.11"
hex = "0.4"
yaml_serde = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
tray-icon = "0.24"
muda = "0.19"
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
