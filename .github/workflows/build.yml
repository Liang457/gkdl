name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: 检查与测试
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --check

      - name: Clippy 静态检查
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: 运行测试
        run: cargo test --locked

  build:
    name: 编译 Release 二进制
    needs: ci
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 编译 Release
        run: cargo build --release --locked

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: gkdl-windows-x86_64
          path: target/release/gkdl.exe
          if-no-files-found: error
          retention-days: 30

  # 推送 v* 标签时把编译产物发布到 GitHub Releases（产物名带版本号，如 gkdl-v0.2.10-windows-x86_64.zip）
  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v7
        with:
          name: gkdl-windows-x86_64
          path: artifact

      - name: 打包 zip
        run: |
          cd artifact
          zip "../gkdl-v${GITHUB_REF_NAME#v}-windows-x86_64.zip" gkdl.exe

      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="gkdl-v${GITHUB_REF_NAME#v}-windows-x86_64.zip"
          # 本作业不检出仓库，gh 必须用 -R 显式指定仓库（默认靠 git remote 探测会报 not a git repository）
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" "$zip" --title "$GITHUB_REF_NAME" --generate-notes
          fi
